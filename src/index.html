<!doctype html>
<html lang="en">
  <head prefix="og: http://ogp.me/ns#">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tone.js を使った Text-to-speech です。">
    <title>Tone TTS</title>
    <meta property="og:title" content="Tone TTS">
    <meta property="og:site_name" content="Tone TTS">
    <meta property="og:description" content="Tone.js を使った Text-to-speech です。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://marmooo.github.io/tone-tts/">
    <meta property="og:image" content="https://marmooo.github.io/tone-tts/favicon/apple-touch-icon.png">
    <meta name="twitter:card" content="summary">
    <script>
      (function() {
        const saved = localStorage.getItem("darkMode");
        const prefersDark = globalThis.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
    </script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F2179JXDYY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F2179JXDYY');
    </script>
    <script>
      navigator.serviceWorker.register("/tone-tts/sw.js");
    </script>
    <link rel="icon" type="image/png" href="/tone-tts/favicon/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/tone-tts/favicon/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/tone-tts/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/tone-tts/favicon/site.webmanifest">
    <link class="drop-inline-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
      html[data-bs-theme="dark"] .favicon { filter: invert(1) hue-rotate(180deg); }
    </style>
    <script data-ad-client="ca-pub-6459713332128733" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand">
        <div class="container flex-wrap">
          <a class="navbar-brand" href="/tone-tts/">
            <img class="favicon" alt="" src="/tone-tts/favicon/favicon.svg" width="32" height="32">
            Tone TTS
          </a>
          <div class="navbar-nav">
            <button title="toggle dark-mode" id="toggleDarkMode" class="fs-4 btn p-0" type="button">🌓</button>
          </div>
        </div>
      </nav>
    </header>
    <main class="container">
      <noscript>
        <div class="alert alert-warning">Please turn on JavaScript.</div>
      </noscript>
      <p>Tone.js を使った Text-to-speech です。
      </p>
      <div class="row pt-3">
        <div class="col-md pb-3">
          <h5>コマンド</h5>
          <p>入力すると話し方が変わります。</p>
          <div>
            、
            ､
            ，
            ,
            。
            ｡
            ．
            .
            …
            ･･･
            ↑
            ↗
            ⤴
            ⇡
            ⬆
            ↓
            ↘
            ⤵
            ⇓
            ⇣
            ⬇
            !
            ‼
            !!
            ！
            ❗
            ❕
            ?
            ??
            ?!
            !?
            ？
            ❓
            ❔
          </div>
        </div>
        <div class="col-sm pb-3">
          <h5>オプション</h5>
          <table class="table">
            <tbody>
              <tr>
                <td><label for="pitch">pitch</label></td>
                <td><input class="form-range" type="range" id="pitch" name="pitch"
                  min="36" max="84" value="60" step="1"></td>
                <td><button title="reset" id="resetPitch" class="btn p-0" type="button">↩️</button></td>
              </tr>
              <tr>
                <td><label for="rate">rate</label></td>
                <td><input class="form-range" type="range" id="rate" name="rate"
                  min="1" max="960" value="480" step="1"></td>
                <td><button title="reset" id="resetRate" class="btn p-0" type="button">↩️</button></td>
              </tr>
              <tr>
                <td><label for="volume">volume</label></td>
                <td><input class="form-range" type="range" id="volume" name="volume"
                  min="0" max="2" value="1" step="0.01"></td>
                <td><button title="reset" id="resetVolume" class="btn p-0" type="button">↩️</button></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="col-sm pb-3">
          <h5>音声情報</h5>
          <div class="table-responsive">
            <table class="table table-sm table-striped text-wrap">
              <tbody>
                <tr><th>lang</th><td id="voiceLang">ja-JP</td></tr>
                <tr><th>name</th><td id="voiceName">波音リツ</td></tr>
                <tr><th>URI</th>
                  <td id="voiceURI">
                    <a href="https://www.canon-voice.com/">
                      カノンの落ちる城
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div id="controller" class="py-4 d-flex justify-content-center">
        <input title="search" id="searchText" class="form-control w-50" type="text" placeholder="テキストを入力" autofocus>
        <button title="search" id="search" class="btn" type="button">🔊</button>
      </div>
    </main>
    <footer class="pt-4 alert text-center">
      <div>
        <a class="px-1" href="/">Home</a>
        <a class="px-1" href="/terms/">Terms</a>
        <a class="px-1" href="https://github.com/marmooo/tone-tts">Contact</a>
      </div>
      <div class="text-muted">&copy; <a href="https://github.com/marmooo">marmooo</a></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js" integrity="sha256-okNMzd3StHfxBUQDTt74n2sucn+VwVAJM81Pn8MGo9c=" crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>
</html>
